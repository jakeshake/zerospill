# =============================================================================
# Sonoff S31 (US) power-metering plug: OPTIONAL data-gathering tool
# ~1 s power readings for one fast-cycling, high-power appliance (air fryer, kettle,
# washer). See esphome/README.md for why this is a diagnostic tool, not a zero-export fix.
# Flashing: open the case, then 3.3 V USB-UART on the test pads (GPIO0 to GND at power-up).
# =============================================================================
esphome:
  name: s31-plug
  friendly_name: S31 Plug

esp8266:
  board: esp01_1m

logger:
  baud_rate: 0                        # hardware UART is used by the CSE7766 meter

api:
  reboot_timeout: 0s                  # never reboot (and cut the appliance) if HA is offline
  encryption:
    key: !secret s31_plug_api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "S31-Plug-Fallback"
    password: !secret fallback_ap_password

captive_portal:

uart:
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

sensor:
  - platform: cse7766
    voltage:
      name: "Voltage"
      filters:
        - throttle_average: 10s
    current:
      name: "Current"
      filters:
        - throttle_average: 10s
    power:
      name: "Power"
      filters:
        - throttle_average: 1s
    energy:
      name: "Energy"
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "Button"
    on_press:
      - switch.toggle: relay

switch:
  - platform: gpio
    pin: GPIO12
    id: relay
    name: "Relay"
    restore_mode: ALWAYS_ON           # appliance stays powered after a reboot

status_led:
  pin:
    number: GPIO13
    inverted: true
