# =============================================================================
# Emporia Vue Utility Connect, flashed with ESPHome
# Component and flashing instructions: https://github.com/nekorevend/esphome-emporia-vue-utility
# (follow that repo; it's maintained upstream). Your utility must provision the device
# with your smart meter first, and only supported meters/utilities work.
#
# The package's sensor.grid_power is this device's "Watts" sensor (+ import / - export).
# =============================================================================
esphome:
  name: vue-utility
  friendly_name: Vue Utility

esp32:
  board: esp-wrover-kit
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/nekorevend/esphome-emporia-vue-utility

logger:
  logs:
    Vue: DEBUG

api:
  encryption:
    key: !secret vue_utility_api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Vue-Utility-Fallback"
    password: !secret fallback_ap_password

captive_portal:

uart:
  id: emporia_uart
  rx_pin: GPIO21
  tx_pin: GPIO22
  baud_rate: 115200

sensor:
  - platform: emporia_vue_utility
    uart_id: emporia_uart
    update_interval: 5s
    # Instantaneous power stays UNFILTERED: the zero-export controller needs every reading.
    power:
      name: "Watts"
    power_import:
      name: "Watts Consumed"
    power_export:
      name: "Watts Returned"
    # Energy totals change slowly; throttle to keep the recorder lean.
    energy:
      name: "Watt-hours"
      filters:
        - or:
            - throttle: 5min
            - delta: 100
    energy_import:
      name: "Watt-hours Consumed"
      filters:
        - or:
            - throttle: 5min
            - delta: 100
    energy_export:
      name: "Watt-hours Produced"
      filters:
        - or:
            - throttle: 5min
            - delta: 100

status_led:
  pin:
    number: GPIO25
    inverted: false
